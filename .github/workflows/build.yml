name: Сборка BlackCraft APK

on:
  workflow_dispatch:          # кнопка «Run workflow» на вкладке Actions
  push:
    branches: [main]          # сборка запускается и сама при каждой загрузке файлов
    paths-ignore:
      - "README.md"

permissions:
  contents: read

concurrency:
  group: blackcraft-apk
  cancel-in-progress: true

jobs:
  apk:
    name: Сборка debug-APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android SDK Platform 36 и Build-Tools 36.0.0
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Версии инструментов
        run: |
          node -v
          npm -v
          java -version
          python3 --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Установить Capacitor (npm)
        run: npm install --no-audit --no-fund

      - name: Подготовить игру (папка www)
        run: python3 prepare_android.py web

      - name: Создать Android-проект (npx cap add android)
        run: |
          npx cap --version
          npx cap add android

      - name: Установить Pillow (для иконок)
        run: python3 -m pip install --user pillow

      - name: Применить настройки BlackCraft
        run: python3 prepare_android.py native

      - name: Синхронизировать (npx cap sync)
        run: npx cap sync android

      - name: Собрать APK (Gradle)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Переименовать APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk BlackCraft-debug.apk
          ls -l BlackCraft-debug.apk

      - name: Загрузить APK в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlackCraft-APK
          path: BlackCraft-debug.apk
          if-no-files-found: error
          retention-days: 30
